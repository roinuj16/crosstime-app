<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: usa a tela toda no iPhone (o app respeita as bordas seguras) -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- web app instalável (tela de início) -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CronoBox" />
    <style id="expo-reset">
      html, body { height: 100%; background: #0B0B0B; }
      body { overflow: hidden; overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
      #root { display: flex; height: 100%; flex: 1; }
    </style>
  </head>

  <body>
    <noscript>O CronoBox precisa de JavaScript ligado.</noscript>
    <div id="root"></div>
    <script>
      // Funciona sem internet depois do primeiro acesso. Fora do servidor de desenvolvimento.
      if ('serviceWorker' in navigator && !/^(localhost|127\.|10\.|192\.168\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname)) {
        window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
      }
      // Pede ao navegador para não apagar os treinos salvos
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function () {});
    </script>
  </body>
</html>
